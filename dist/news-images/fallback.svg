<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ФЕНКА — архив новостей</title>
  <desc id="description">Фирменная обложка для архивной новости без сохранившейся фотографии</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061b34"/>
      <stop offset="0.56" stop-color="#0b3d70"/>
      <stop offset="1" stop-color="#07182f"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="68%">
      <stop offset="0" stop-color="#25a7ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#25a7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ba58"/>
      <stop offset=".5" stop-color="#fff1b6"/>
      <stop offset="1" stop-color="#c98b2f"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8acbff" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#background)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <g fill="none" stroke="#53bdff" stroke-width="2" stroke-opacity=".18">
    <path d="M-80 610C160 430 330 470 510 350S850 80 1280 180"/>
    <path d="M-60 680C210 490 390 550 590 390S930 150 1260 250"/>
  </g>
  <g transform="translate(102 104)">
    <path d="M0 0h6v144H0zm40 24h6v120h-6zm40-24h6v144h-6zm40 24h6v120h-6zm40-24h6v144h-6zm-32 158c0 32-25 58-56 58s-56-26-56-58h8c0 27 22 49 48 49s48-22 48-49z" fill="url(#gold)"/>
    <circle cx="3" cy="-12" r="9" fill="#ef405f" filter="url(#softGlow)"/>
    <circle cx="43" cy="12" r="9" fill="#ef405f" filter="url(#softGlow)"/>
    <circle cx="83" cy="-12" r="9" fill="#ef405f" filter="url(#softGlow)"/>
    <circle cx="123" cy="12" r="9" fill="#ef405f" filter="url(#softGlow)"/>
    <circle cx="163" cy="-12" r="9" fill="#ef405f" filter="url(#softGlow)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="102" y="466" fill="#fff" font-size="118" font-weight="700" letter-spacing="6">ФЕНКА</text>
    <rect x="102" y="505" width="286" height="8" rx="4" fill="url(#gold)"/>
    <text x="102" y="582" fill="#c9e6fa" font-size="37" letter-spacing="8">АРХИВ НОВОСТЕЙ</text>
  </g>
  <circle cx="1032" cy="650" r="112" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1032" cy="650" r="72" fill="none" stroke="#e8ba58" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="1032" cy="650" r="7" fill="#ef405f" filter="url(#softGlow)"/>
</svg>
